name: HTML Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'

      # Step 3: Install linting and formatting tools
      - name: Install Tooling
        run: npm install -g htmlhint prettier

      # Step 4: Run HTMLHint to check for syntax errors
      - name: Lint HTML
        run: htmlhint "**/*.html"

      # Step 5: Check if the code follows proper formatting rules
      - name: Check Code Formatting
        run: prettier --check "**/*.html"
